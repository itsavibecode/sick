# Mirror static files from this repo into the /sick subfolder of a
# second repo (which serves dev.rizzo.cc). Runs on every push to main.
#
# Privacy notes (intentional — see project_sick.md memory):
#   - The target repo is on a separate GitHub account that should NOT
#     be linkable back to this one in public history. Measures:
#       1. README.md, .github/ excluded from the copy so source-only
#          files don't leak.
#       2. Sed rewrites any remaining itsavibecode.github.io/sick refs
#          in HTML/JS/JSON to dev.rizzo.cc/sick (catches og:url,
#          twitter:image, canonical, manifest start_url comments).
#       3. Commit messages on the target repo are generic ("Update /sick")
#          and never reference the source repo by name.
#       4. Committer is github-actions[bot], no personal email.
#
# Setup (one-time):
#   1. Create a fine-grained PAT owned by the target account with
#      Contents: Read and Write on the target repo only. The same
#      PAT used by the usage mirror can be reused here.
#   2. Add it as a repo secret here named MIRROR_TO_DEV_PAT.
#   3. Add dev.rizzo.cc to Firebase Auth → Settings → Authorized
#      domains so Google sign-in works on the mirrored deployment.
#   4. Either push (triggers automatically) or click "Run workflow"
#      on the Actions tab to mirror on demand.

name: Mirror /sick to secondary deployment

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual trigger from Actions tab

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: yada-yoda/dev
          token: ${{ secrets.MIRROR_TO_DEV_PAT }}
          path: dst

      - name: Sync static files into dst/sick/
        run: |
          # Wipe and re-create so deletions in source propagate.
          rm -rf dst/sick
          mkdir -p dst/sick
          # Copy everything except dev-only / source-specific files.
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.scripts' \
            --exclude 'README.md' \
            src/ dst/sick/

      - name: Rewrite hardcoded origin refs to dev.rizzo.cc
        run: |
          # Defense-in-depth: three passes catching progressively looser
          # forms of the source-hostname so descriptive prose in comments
          # can't leak the cross-account relationship either.
          # Pass 1: full URL with /sick suffix (og:url, canonical, twitter:image, etc.)
          find dst/sick -type f \( -name '*.html' -o -name '*.js' -o -name '*.json' -o -name '*.webmanifest' \) -print0 |
            xargs -0 sed -i 's|https://itsavibecode\.github\.io/sick|https://dev.rizzo.cc/sick|g'
          # Pass 2: bare full hostname references
          find dst/sick -type f \( -name '*.html' -o -name '*.js' -o -name '*.json' -o -name '*.webmanifest' \) -print0 |
            xargs -0 sed -i 's|itsavibecode\.github\.io|dev.rizzo.cc|g'
          # Pass 3: bare-suffix mentions in prose ("the github.io URL...").
          # Safe because github.io has no legitimate non-hostname usage in
          # these files — it's always referring to the deployment origin.
          find dst/sick -type f \( -name '*.html' -o -name '*.js' -o -name '*.json' -o -name '*.webmanifest' \) -print0 |
            xargs -0 sed -i 's|github\.io|rizzo.cc|g'

      - name: Commit and push if changed
        working-directory: dst
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sick/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          # Intentionally generic — no source-repo name, no app version.
          git commit -m "Update /sick"
          git push
